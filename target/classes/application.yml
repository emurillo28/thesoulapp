spring:
  application:
    name: thesoulapp
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:thesoulapp}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  security:
    require-ssl: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    max-threads: 200
    min-spare-threads: 20
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE:}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000}

aws:
  region: ${AWS_REGION:us-east-1}
  accessKey: ${AWS_ACCESS_KEY:}
  secretKey: ${AWS_SECRET_KEY:}
  cognito:
    userPoolId: ${COGNITO_USER_POOL_ID:}
    clientId: ${COGNITO_CLIENT_ID:}
    region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${S3_BUCKET:thesoulapp-files}
    storageClass: INTELLIGENT_TIERING
    transferAcceleration: false
    maxFileSize: 10485760 # 10MB
    allowedFileTypes: jpg,jpeg,png,pdf,doc,docx
  sns:
    verificationTopic: ${SNS_VERIFICATION_TOPIC:}
    notificationTopic: ${SNS_NOTIFICATION_TOPIC:}
    fifoTopic: true
  ses:
    sourceEmail: ${SES_SOURCE_EMAIL:}
    templatePath: templates/email
    maxBulkEmails: 50
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:}
    tables:
      assessments: ${DYNAMODB_ASSESSMENTS_TABLE:Assessments}
    autoscaling:
      enabled: true
      minCapacity: 1
      maxCapacity: 10
      targetUtilization: 70

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type
    max-age: 3600
  rate-limiting:
    enabled: true
    requests-per-second: 10
    burst-size: 20
  ip-filtering:
    enabled: true
    whitelist: ${IP_WHITELIST:}
    blacklist: ${IP_BLACKLIST:}

logging:
  level:
    root: INFO
    com.thesoulapp: DEBUG
    com.amazonaws.util.EC2MetadataUtils: ERROR
    org.springframework.web: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/thesoulapp.log
    max-size: 10MB
    max-history: 7

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      cloudwatch:
        enabled: true
        namespace: TheSoulApp
        step: 1m 