# Production-specific configuration
spring.datasource.url=${RDS_JDBC_URL}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Application URLs
app.api.base-url=${APP_API_BASE_URL:https://api.thesoulapp.com/api}
app.websocket.url=${APP_WEBSOCKET_URL:wss://api.thesoulapp.com/ws}

# CORS settings for Vercel
cors.allowed-origins=https://thesoulapp.vercel.app,https://thesoulapp.com,https://www.thesoulapp.com,http://localhost:3000

# Feature flags
feature.tasks.enabled=${FEATURE_TASKS_ENABLED:false}
feature.blog.enabled=${FEATURE_BLOG_ENABLED:false}
feature.insights.enabled=${FEATURE_INSIGHTS_ENABLED:false}

# Disable debug logging
logging.level.root=INFO
logging.level.com.thesoulapp=INFO
logging.level.org.springframework.web=INFO

# Enable response compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# Set reasonable timeouts
spring.mvc.async.request-timeout=30000
server.tomcat.connection-timeout=20000
server.servlet.session.timeout=30m

# Security settings
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# SSL configuration
server.ssl.enabled=${SSL_ENABLED:false}

# Stripe API Key
stripe.api.key=${STRIPE_API_KEY} 