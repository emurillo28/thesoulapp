name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Build with Gradle
        run:  chmod +x ./gradlew && ./gradlew build
        
      - name: Rename Jar for Consistent Name
        run: mv build/libs/*.jar build/libs/app.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: build-artifact
          path: build/libs/app.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: build-artifact

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: soulapp-backend
          environment_name: soulapp-backend-env
          version_label: v-${{ github.run_number }}
          region: ${{ secrets.AWS_REGION }}
          bucket_name: soulapp-deployments
          bucket_key: spring-app-${{ github.run_number }}.jar
          deployment_package: build/libs/*.jar

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Run tests
        run: ./gradlew test

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'TheSoulApp'
          path: '.'
          format: 'HTML'
          out: 'reports' 
